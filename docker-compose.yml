services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threadora
      POSTGRES_USER: threadora
      POSTGRES_PASSWORD: threadora_dev
    ports: ["5432:5432"]
    volumes: [threadora_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadora -d threadora"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  threadora_pgdata:
